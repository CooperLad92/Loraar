<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSSI Cloud Viewer</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font:13px system-ui,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;touch-action:none}
  #ui{position:fixed;left:0;right:0;top:0;z-index:1;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none}
  #ui>*{pointer-events:auto}
  .card{background:#0d1117cc;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  label.btn{background:#238636;border:1px solid #2ea043;border-radius:8px;padding:9px 12px;cursor:pointer}
  input[type=file]{display:none}
  input[type=range]{width:110px}
  #msg{color:#8b949e}
</style>
</head>
<body>
<div id="ui"><div class="card">
  <label class="btn">Open .ply / .txt<input id="file" type="file" accept=".ply,.txt,text/plain"></label>
  <span>Size <input id="size" type="range" min="0.01" max="0.15" step="0.005" value="0.05"></span>
  <span id="msg">Load a file exported from the AR page</span>
</div></div>
<script type="importmap">
{"imports":{"three":"https://esm.sh/three@0.160.0","three/addons/":"https://esm.sh/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d1117);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.05, 1000);
camera.position.set(4,3,6);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
const grid = new THREE.GridHelper(30, 30, 0x30363d, 0x1c222b); scene.add(grid);
let cloud = null;
const mat = new THREE.PointsMaterial({size:0.05, vertexColors:true, sizeAttenuation:true});

function load(text){
  const lines = text.split('\n');
  const h = lines.indexOf('end_header');
  if(h < 0) throw new Error('not an ASCII PLY');
  const cnt = parseInt(lines.find(l => l.startsWith('element vertex')).split(' ')[2]);
  const pos = new Float32Array(cnt*3), col = new Float32Array(cnt*3);
  let k = 0;
  for(let i = h+1; i < lines.length && k < cnt; i++){
    const t = lines[i].split(' ');
    if(t.length < 6) continue;
    pos[k*3]=+t[0]; pos[k*3+1]=+t[1]; pos[k*3+2]=+t[2];
    col[k*3]=t[3]/255; col[k*3+1]=t[4]/255; col[k*3+2]=t[5]/255; k++;
  }
  if(cloud){ scene.remove(cloud); cloud.geometry.dispose(); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0,k*3),3));
  g.setAttribute('color', new THREE.BufferAttribute(col.subarray(0,k*3),3));
  cloud = new THREE.Points(g, mat); cloud.frustumCulled = false; scene.add(cloud);
  g.computeBoundingBox();
  const b = g.boundingBox, c = b.getCenter(new THREE.Vector3()), r = Math.max(b.getSize(new THREE.Vector3()).length()/2, 1);
  camera.position.set(c.x+r*1.2, c.y+r*0.8, c.z+r*1.6);
  controls.target.copy(c); controls.update();
  grid.position.set(c.x, b.min.y, c.z);
  $('msg').textContent = `${k.toLocaleString()} points`;
}
$('file').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{ load(await f.text()); }catch(err){ $('msg').textContent = 'Error: ' + err.message; }
};
$('size').oninput = e => { mat.size = +e.target.value; };
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
